<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">🤖</div>
            <h2>AI Assistant</h2>
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="history">

            <p class="history-title">Recent Chats</p>

            <div class="history-item">
                💬 Python Projects
            </div>

            <div class="history-item">
                💬 Web Development
            </div>

            <div class="history-item">
                💬 SQL Questions
            </div>

            <div class="history-item">
                💬 Interview Preparation
            </div>

        </div>

        <div class="sidebar-bottom">

            <button onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button onclick="clearChat()">
                🗑️ Clear Chat
            </button>

        </div>

    </aside>


    <!-- MAIN CHAT -->
    <main class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">

            <div>
                <h2>AI Chatbot</h2>

                <span class="status">
                    <span class="online-dot"></span>
                    Online
                </span>
            </div>

            <button class="menu-btn">
                ⋮
            </button>

        </header>


        <!-- CHAT AREA -->
        <section class="chat-box" id="chatBox">

            <!-- WELCOME MESSAGE -->
            <div class="message bot-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="message-content">

                    <strong>AI Assistant</strong>

                    <p>
                        Hello! 👋 I'm your AI Assistant.
                        How can I help you today?
                    </p>

                    <div class="quick-actions">

                        <button onclick="quickMessage('Give me Python project ideas')">
                            🐍 Python Projects
                        </button>

                        <button onclick="quickMessage('Explain HTML')">
                            🌐 Learn HTML
                        </button>

                        <button onclick="quickMessage('Give me SQL interview questions')">
                            🗄️ SQL Questions
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- TYPING INDICATOR -->
        <div id="typing" class="typing hidden">

            <div class="avatar">
                🤖
            </div>

            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- INPUT AREA -->
        <footer class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="userInput"
                    placeholder="Message AI Assistant..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                    id="sendButton"
                >
                    ➤
                </button>

            </div>

            <p class="footer-text">
                AI Assistant may generate incorrect information.
            </p>

        </footer>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
